name: Build static Windows Skia caches

on:
  push:
    branches: [main]
    tags: ["cache-v*"]
    paths:
      - ".github/workflows/build-static-skia.yml"
      - "scripts/build-skia-cache.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.profile }}
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile:
          - skiala-0.153.3-cpu
          - slint-0.99.0-opengl

    steps:
      - name: Checkout cache builder
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install native build tools
        shell: pwsh
        run: |
          choco upgrade llvm -y --no-progress
          choco install ninja -y --no-progress

      - name: Build and validate static Skia cache
        shell: pwsh
        run: ./scripts/build-skia-cache.ps1 -Profile '${{ matrix.profile }}'

      - name: Upload cache
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}
          path: artifacts/${{ matrix.profile }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish cache release
    if: startsWith(github.ref, 'refs/tags/cache-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated caches
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.json
            artifacts/*.lock
